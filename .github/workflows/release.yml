name: Release Iris

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Build checks
    uses: ./.github/workflows/build.yml

  release:
    name: Signed release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out Iris
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          mapfile -t versions < <(
            sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle
          )
          if (( ${#versions[@]} != 1 )); then
            echo "::error::Expected exactly one versionName in app/build.gradle"
            exit 1
          fi

          version="${versions[0]}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version v$version"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release credentials and decode keystore
        shell: bash
        env:
          IRIS_KEYSTORE_BASE64: ${{ secrets.IRIS_KEYSTORE_BASE64 }}
          IRIS_KEYSTORE_PASSWORD: ${{ secrets.IRIS_KEYSTORE_PASSWORD }}
          IRIS_KEY_ALIAS: ${{ secrets.IRIS_KEY_ALIAS }}
          IRIS_KEY_PASSWORD: ${{ secrets.IRIS_KEY_PASSWORD }}
        run: |
          missing=()
          for name in \
            IRIS_KEYSTORE_BASE64 \
            IRIS_KEYSTORE_PASSWORD \
            IRIS_KEY_ALIAS \
            IRIS_KEY_PASSWORD
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

          umask 077
          printf '%s' "$IRIS_KEYSTORE_BASE64" |
            base64 --decode > "$RUNNER_TEMP/iris-release.jks"

      - name: Build signed release APK
        env:
          IRIS_KEYSTORE_FILE: ${{ runner.temp }}/iris-release.jks
          IRIS_KEYSTORE_PASSWORD: ${{ secrets.IRIS_KEYSTORE_PASSWORD }}
          IRIS_KEY_ALIAS: ${{ secrets.IRIS_KEY_ALIAS }}
          IRIS_KEY_PASSWORD: ${{ secrets.IRIS_KEY_PASSWORD }}
        run: ./gradlew testNonRootReleaseUnitTest assembleNonRootRelease

      - name: Verify and stage release assets
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/nonRoot/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}"
            exit 1
          fi

          apksigner="$(
            find "$ANDROID_HOME/build-tools" \
              -mindepth 2 -maxdepth 2 -type f -name apksigner -print |
              sort -V |
              tail -n 1
          )"
          if [[ -z "$apksigner" ]]; then
            echo "::error::Unable to locate apksigner in the Android SDK"
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "${apks[0]}"

          mapping="app/build/outputs/mapping/nonRootRelease/mapping.txt"
          symbols="app/build/outputs/native-debug-symbols/nonRootRelease/native-debug-symbols.zip"
          for asset in "$mapping" "$symbols"; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::Missing release asset: $asset"
              exit 1
            fi
          done

          mkdir -p release-assets
          cp "${apks[0]}" "release-assets/iris-$RELEASE_VERSION.apk"
          cp "$mapping" "release-assets/iris-$RELEASE_VERSION-mapping.txt"
          cp "$symbols" "release-assets/iris-$RELEASE_VERSION-native-debug-symbols.zip"
          (
            cd release-assets
            sha256sum iris-* > SHA256SUMS
          )

      - name: Remove signing keystore
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/iris-release.jks"

      - name: Upload signed release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: iris-release-${{ steps.release.outputs.version }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download signed release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: iris-release-${{ needs.release.outputs.version }}
          path: release-assets

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          else
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          fi
