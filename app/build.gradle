apply plugin: 'com.android.application'

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        minSdk 21
        targetSdk 36

        versionName "0.1.0"
        versionCode = 1

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    flavorDimensions.add("root")

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    productFlavors {
        root {
            // Android O has native mouse capture, so don't show the rooted
            // version to devices running O on the Play Store.
            maxSdk 25

            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=root"
                }
            }

            applicationId "dev.prism.iris.root"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "true"
        }

        nonRoot {
            externalNativeBuild {
                ndkBuild {
                    arguments "PRODUCT_FLAVOR=nonRoot"
                }
            }

            applicationId "dev.prism.iris"
            dimension "root"
            buildConfigField "boolean", "ROOT_BUILD", "false"
        }
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        disable 'MissingTranslation'
        lintConfig file('lint.xml')
    }

    bundle {
        language {
            // Avoid splitting by language, since we allow users
            // to manually switch language in settings.
            enableSplit = false
        }
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_label", "Iris (Debug)"
            resValue "string", "app_label_root", "Iris (Root Debug)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            resValue "string", "app_label", "Iris"
            resValue "string", "app_label_root", "Iris (Root)"

            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            if (System.getenv("IRIS_KEYSTORE_FILE")) {
                signingConfig signingConfigs.create("irisRelease") {
                    storeFile file(System.getenv("IRIS_KEYSTORE_FILE"))
                    storePassword System.getenv("IRIS_KEYSTORE_PASSWORD")
                    keyAlias System.getenv("IRIS_KEY_ALIAS")
                    keyPassword System.getenv("IRIS_KEY_PASSWORD")
                }
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85'
    implementation 'org.jcodec:jcodec:0.2.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.github.cgutman:ShieldControllerExtensions:1.0.1'
    testImplementation 'junit:junit:4.13.2'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}

// PyroWave remains a separate optional library: older Android devices never load Vulkan.
android.sourceSets.main.jniLibs.srcDir(layout.buildDirectory.dir("generated/pyrowave/jniLibs").get().asFile)
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/pyrowave/assets").get().asFile)

// Exercise native patch generation from the same nested Git layout used by Gradle.
def testPyroWaveProtocol = tasks.register("testPyroWaveProtocol", Exec) {
    commandLine "python3", "-m", "unittest", "discover", "-s",
            rootProject.file("tools/pyrowave/tests"), "-v"
}
tasks.named("check").configure { dependsOn testPyroWaveProtocol }

def preparePyroWaveProtocol = tasks.register("preparePyroWaveProtocol", Exec) {
    inputs.dir("src/main/jni/moonlight-core/moonlight-common-c/src")
    inputs.files(rootProject.file("tools/pyrowave/prepare_protocol.py"), rootProject.file("tools/pyrowave/moonlight-common-c.patch"))
    outputs.dir(layout.buildDirectory.dir("generated/pyrowave/common"))
    commandLine "python3", rootProject.file("tools/pyrowave/prepare_protocol.py"),
            file("src/main/jni/moonlight-core/moonlight-common-c/src"),
            layout.buildDirectory.dir("generated/pyrowave/common").get().asFile
}

def buildPyroWave = tasks.register("buildPyroWave", Exec) {
    inputs.dir("src/main/jni/pyrowave")
    inputs.dir(rootProject.file("tools/pyrowave"))
    outputs.dir(layout.buildDirectory.dir("generated/pyrowave/jniLibs"))
    outputs.dir(layout.buildDirectory.dir("generated/pyrowave/assets"))
    doFirst {
        commandLine "python3", rootProject.file("tools/pyrowave/build_android.py"),
                "--ndk", androidComponents.sdkComponents.ndkDirectory.get().asFile
    }
}

tasks.named("preBuild").configure { dependsOn preparePyroWaveProtocol, buildPyroWave }
tasks.configureEach {
    if (name.startsWith("configureNdkBuild") || name.startsWith("buildNdkBuild")) {
        dependsOn preparePyroWaveProtocol
    }
}
